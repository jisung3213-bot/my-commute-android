plugins {
    id 'com.android.application'
}

// Only enable Google Services when the user installs their Firebase config file.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def localConfig = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localConfig.load(it) }
def tmapKey = (localConfig.getProperty('TMAP_APP_KEY') ?: '').replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace 'com.example.seoulmobilitytester'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.seoulmobilitytester'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'TMAP_APP_KEY', '"' + tmapKey + '"'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
}
